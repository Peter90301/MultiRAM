[preprocessing]
min_spectra_ref = 512
min_spectra_query = 1

resolution = 3

bin_size = 0.04
min_mz = 101
max_mz = 1500

remove_precursor = True
remove_precursor_tolerance = 0.02

min_intensity = 0.01

min_peaks = 10
min_mz_range = 250

max_peaks_used = 50
max_peaks_used_library = 50

scaling = rank

[search]
# Looser precursor tolerances to increase candidate retrieval
precursor_tolerance_mass_ppm = 50
precursor_tolerance_mass_open_da = 1000

max_ref_batch_size = 200000
max_query_batch_size = 8000
hv_quantize_level = 32
hv_dimensionality = 8192
hv_precision = INT8
use_precomputed_ref_hvs = False

[fdr]
# Allow a higher psm-level FDR for exploratory comparison
fdr_threshold = 0.05
fdr_tolerance_mass = 0.5
fdr_tolerance_mode = Da
fdr_min_group_size = 5
